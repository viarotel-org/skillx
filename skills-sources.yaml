# yaml-language-server: $schema=./schemas/skills-sources.schema.json

version: 1
deduplicate: true

defaults:
  branch: main
  path: skills
  mode: flat
  enabled: true
  preserveOnFailure: false
  cloneTimeoutMs: 300000
  cloneMaxAttempts: 3
  sourceConcurrency: 3
  includes: []
  excludes: []

sources:
  - id: skillx
    type: local
    location: skillx
    path: .

  - id: awesome-copilot
    type: remote
    location: https://github.com/github/awesome-copilot
    branch: main
    path: skills

  - id: anthropic
    type: remote
    location: https://github.com/anthropics/skills.git
    branch: main
    path: skills

  - id: openai
    type: remote
    location: https://github.com/openai/skills.git
    branch: main
    path: skills

  - id: antfu
    type: remote
    location: https://github.com/antfu/skills.git
    branch: main
    path: skills

  - id: mattpocock
    type: remote
    location: https://github.com/mattpocock/skills.git
    branch: main
    path: skills

  - id: open-wot
    type: remote
    location: https://github.com/wot-ui/open-wot.git
    branch: main
    path: skills

  - id: addyosmani
    type: remote
    location: https://github.com/addyosmani/agent-skills.git
    branch: main
    path: skills

  - id: android
    type: remote
    location: https://github.com/android/skills.git
    branch: main
    path: .

  - id: vuejs-ai
    type: remote
    location: https://github.com/vuejs-ai/skills.git
    branch: main
    path: skills

  - id: shopify-ai-toolkit
    type: remote
    location: https://github.com/Shopify/Shopify-AI-Toolkit.git
    branch: main
    path: skills

  - id: netlify-context-and-tools
    type: remote
    location: https://github.com/netlify/context-and-tools.git
    branch: main
    path: skills

  - id: full-stack-skills
    type: remote
    location: https://github.com/partme-ai/full-stack-skills.git
    branch: main
    path: skills
    includes:
      - vue-skills/**
      - vue-ui-skills/**
      - electron-skills/**
      - uniapp-skills/**
      - stitch-skills/**

  - id: ui-ux-pro-max-skill
    type: remote
    location: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill.git
    branch: main
    path: .claude/skills
