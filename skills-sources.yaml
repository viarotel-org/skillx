# yaml-language-server: $schema=./schemas/skills-sources.schema.json

version: 1
deduplicate: true

defaults:
  branch: main
  path: skills
  mode: flat
  enabled: true
  preserveOnFailure: false
  cloneTimeoutMs: 300000
  cloneMaxAttempts: 3
  sourceConcurrency: 3
  includes: []
  excludes: []

sources:
  - id: skillx
    type: local
    location: skillx
    path: .

  - id: vercel-labs
    type: remote
    location: https://github.com/vercel-labs/skills.git
    branch: main
    path: skills
    includes:
      - find-skills

  - id: full-stack-skills-vue
    type: remote
    location: https://github.com/full-stack-skills/vue-skills.git
    branch: main
    path: skills

  - id: full-stack-skills-vue-ui
    type: remote
    location: https://github.com/full-stack-skills/vue-ui-skills.git
    branch: main
    path: skills

  - id: full-stack-skills-electron
    type: remote
    location: https://github.com/full-stack-skills/electron-skills.git
    branch: main
    path: skills

  - id: full-stack-skills-uniapp
    type: remote
    location: https://github.com/full-stack-skills/uniapp-skills.git
    branch: main
    path: skills

  - id: vuejs-ai
    type: remote
    location: https://github.com/vuejs-ai/skills.git
    branch: main
    path: skills
    includes:
      - create-adaptable-composable
      - vue-debug-guides
      - vue-jsx-best-practices
      - vue-options-api-best-practices
      - vue-pinia-best-practices

  - id: addyosmani
    type: remote
    location: https://github.com/addyosmani/agent-skills.git
    branch: main
    path: skills
    includes:
      - acquire-codebase-knowledge
      - api-and-interface-design
      - browser-testing-with-devtools
      - chrome-devtools
      - code-review-and-quality
      - code-simplification
      - context-engineering
      - debugging-and-error-recovery
      - documentation-and-adrs
      - frontend-ui-engineering
      - git-workflow-and-versioning
      - incremental-implementation
      - performance-optimization
      - planning-and-task-breakdown
      - premium-frontend-ui
      - refactor
      - review-and-refactor
      - security-and-hardening
      - shipping-and-launch
      - source-driven-development
      - spec-driven-development
      - web-design-reviewer

  - id: awesome-copilot
    type: remote
    location: https://github.com/github/awesome-copilot
    branch: main
    path: skills
    includes:
      - acquire-codebase-knowledge
      - chrome-devtools
      - premium-frontend-ui
      - web-design-reviewer
      - gsap-framer-scroll-animation
      - refactor
      - review-and-refactor
      - context-map
      - code-tour
      - create-specification
      - create-implementation-plan
      - documentation-writer

  - id: ui-ux-pro-max-skill
    type: remote
    location: https://github.com/nextlevelbuilder/ui-ux-pro-max-skill.git
    branch: main
    path: .claude/skills

  - id: antfu
    type: remote
    location: https://github.com/antfu/skills.git
    branch: main
    path: skills

  - id: netlify-context-and-tools
    type: remote
    location: https://github.com/netlify/context-and-tools.git
    branch: main
    path: skills
    includes:
      - netlify-deploy
      - netlify-frameworks
      - netlify-cli-and-deploy

  - id: shopify-ai-toolkit
    type: remote
    location: https://github.com/Shopify/Shopify-AI-Toolkit.git
    branch: main
    path: skills

  - id: open-wot
    type: remote
    location: https://github.com/wot-ui/open-wot.git
    branch: main
    path: skills
    includes:
      - create-wot-ui-theme
      - migrate-v1-to-v2
      - wot-ui-cli
      - wot-ui-unocss-preset-guide
      - wot-ui-v2

  - id: anthropic
    type: remote
    location: https://github.com/anthropics/skills.git
    branch: main
    path: skills
    includes:
      - frontend-design
      - web-artifacts-builder
      - theme-factory

  - id: openai
    type: remote
    location: https://github.com/openai/skills.git
    branch: main
    path: skills/.curated
    includes:
      - screenshot
      - vercel-deploy
      - cloudflare-deploy

  - id: shadcn-vue
    type: remote
    location: https://github.com/unovue/shadcn-vue.git
    branch: main
    path: skills
