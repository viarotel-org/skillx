version: 1

defaults:
  branch: main
  path: skills
  mode: flat
  enabled: true
  preserveOnFailure: false
  cloneTimeoutMs: 300000
  cloneMaxAttempts: 3
  includes: []
  excludes: []

protectedIds:
  - 'local-*'

sources:
  - id: remote-awesome-copilot
    url: https://github.com/github/awesome-copilot
    branch: main
    path: skills

  - id: remote-anthropic
    url: https://github.com/anthropics/skills.git
    branch: main
    path: skills

  - id: remote-openai
    url: https://github.com/openai/skills.git
    branch: main
    path: skills

  - id: remote-antfu
    url: https://github.com/antfu/skills.git
    branch: main
    path: skills

  - id: remote-mattpocock
    url: https://github.com/mattpocock/skills.git
    branch: main
    path: skills

  - id: remote-open-wot
    url: https://github.com/wot-ui/open-wot.git
    branch: main
    path: skills

  - id: remote-addyosmani
    url: https://github.com/addyosmani/agent-skills.git
    branch: main
    path: skills

  - id: remote-android
    url: https://github.com/android/skills.git
    branch: main
    path: .

  - id: remote-vuejs-ai
    url: https://github.com/vuejs-ai/skills.git
    branch: main
    path: skills
