name: Sync Skills

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - skills-sources.yaml
      - skillx/**

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync subscribed skills
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate configuration
        run: pnpm validate

      - name: Run tests
        run: pnpm test

      - name: Run lint
        run: pnpm lint

      - name: Sync skills
        env:
          SKILLX_WRITE_STEP_SUMMARY: '1'
        run: pnpm sync

      - name: Upload sync summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: skills-sync-summary
          path: .skills-sync/summary.*
          if-no-files-found: ignore

      - name: Detect changes
        id: changes
        run: |
          changed_files="$(git status --porcelain -- skills .skills-sync/manifest.json)"
          if [ -z "$changed_files" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$changed_files"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit synced changes
        if: steps.changes.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- skills .skills-sync/manifest.json
          git commit -m "chore: sync skills subscriptions"

          for attempt in 1 2 3; do
            git pull --rebase origin "$DEFAULT_BRANCH"

            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Failed to push synced changes after $attempt attempts" >&2
              exit 1
            fi

            echo "Push failed; retrying after rebasing latest $DEFAULT_BRANCH"
          done

  release-please:
    name: Release Please
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.event.repository.default_branch }}