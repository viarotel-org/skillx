name: Sync Skills

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
      timezone: Asia/Shanghai

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync subscribed skills
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate configuration
        run: pnpm validate

      - name: Sync skills
        run: pnpm sync

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- skills .skills-sync/manifest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: chore/sync-skills
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          git add skills .skills-sync/manifest.json
          git commit -m "chore: sync skills subscriptions"
          git push --force-with-lease origin "$SYNC_BRANCH"

          if gh pr view "$SYNC_BRANCH" --base "${{ github.event.repository.default_branch }}" >/dev/null 2>&1; then
            gh pr edit "$SYNC_BRANCH" --body-file .skills-sync/summary.md
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$SYNC_BRANCH" \
              --title "chore: sync skills subscriptions" \
              --body-file .skills-sync/summary.md
          fi
